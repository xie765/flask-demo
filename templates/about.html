{% extends 'base.html' %}
{% block title %}
     Learning for best future
{% endblock %}
{% block head %}
{{ super() }}
<style>
    /* 容器样式：居中、限定宽度、加内边距和阴影，让内容不贴边 */
    .about-container {
        max-width: 800px;  /* 限定最大宽度，避免文本行太长 */
        margin: 40px auto; /* 上下间距40px，左右自动居中 */
        padding: 30px;     /* 内边距，让文本和边框有距离 */
        background: #fff;  /* 白色背景 */
        border-radius: 12px; /* 圆角边框，更柔和 */
        box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08); /* 轻微阴影，提升层次感 */
    }

    /* 标题样式（可选，如果你想加标题） */
    .about-title {
        font-size: 24px;    /* 标题字号 */
        color: #222;        /* 标题颜色 */
        margin-bottom: 20px;/* 标题和文本的间距 */
        padding-bottom: 10px;/* 标题下边框内边距 */
        border-bottom: 1px solid #eee; /* 标题下的分隔线 */
        font-weight: 600;   /* 加粗 */
    }

    /* 核心：文本内容样式 */
    .about-content {
        font-size: 16px;    /* 正文字号（16px 是最佳阅读大小） */
        line-height: 1.8;   /* 行高（1.8 倍行高，避免文字拥挤） */
        color: #333;        /* 文本颜色（深灰色，比纯黑更护眼） */
        white-space: pre-wrap; /* 保留文本中的换行符 \n，让多行文本正常显示 */
        letter-spacing: 0.5px; /* 字符间距，提升可读性 */
        text-align: left;   /* 文本左对齐（默认，也可设为 center 居中） */
    }

    /* 可选：给文本中的强调内容加样式（比如你想突出某段文字） */
    .about-content strong {
        color: #007bff; /* 加粗文字用蓝色突出 */
        font-weight: 600;
    }
</style>
{% endblock %}
{% block content %}
<div class="about-container">
    <!-- 可选标题（不需要可以删掉） -->
    <h2 class="about-title">关于本站</h2>
    <!-- 文本内容容器，应用样式 -->
    <div class="about-content">
        {{ info }}
    </div>
</div>
{% endblock %}
